[project]
name = "lcm"
version = "0.1.0"
description = "Semi-automated, human-reviewed cold outreach to tech recruiters and hiring managers"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pdfplumber>=0.11",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
lcm = "lcm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcm"]
